[project]
name = "ai-companion-backend"
version = "0.1.0"
description = "AI 伴侣应用后端（FastAPI + OpenAI 兼容 LLM + 记忆层）"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "websockets==17.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.1",
    "asyncpg==0.31.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.2",
    "alembic==1.20.0",
    "openai==3.22.1",
    "httpx==0.28.1",
    "loguru==0.7.3",
    "orjson==3.12.0",
    "tenacity==9.1.4",
    "pgvector==0.5.0",
    "mem0ai==2.2.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "aiosqlite==0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 必须显式指定：项目名 ai-companion-backend 对应的目录名是 ai_companion_backend，
# 而代码在 app/ 下，hatchling 猜不出来就会报
# "no directory that matches the name of your project" 让 uv sync 中断。
#
# 装成可编辑包不是多余的：alembic 的入口脚本不会把 CWD 加进 sys.path，
# 只有 app 作为包被安装，`uv run alembic upgrade head` 才能 import 到 app。
packages = ["app"]

[tool.uv]
# 包源：清华镜像。写进配置而不是靠临时环境变量，
# 否则 uv sync 会拿默认源重新解析，把 uv.lock 里的源地址整片改写。
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
